version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project

commands:
  install_aws_cli:
    steps:
      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y unzip
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install

  restore_npm_cache:
    steps:
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
            - npm-deps-v1-

  save_npm_cache:
    steps:
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  install-dependencies:
    executor: node
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - save_npm_cache

  lint:
    executor: node
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Lint
          command: npm run lint

  test:
    executor: node
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Test
          command: npm run test

  build:
    executor: node
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build
          command: npm run build

  build-and-push-image:
    executor: node
    environment:
      ECR_REPOSITORY_NAME: dynamo-db-api
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - install_aws_cli
      - run:
          name: Build and push Docker image
          command: |
            : "${AWS_REGION:?Set AWS_REGION in CircleCI project environment variables}"

            AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE_TAG="${CIRCLE_SHA1}"
            IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"

            aws ecr describe-repositories --repository-names "${ECR_REPOSITORY_NAME}" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "${ECR_REPOSITORY_NAME}" >/dev/null

            aws ecr get-login-password --region "${AWS_REGION}" | \
              docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            docker build -t "${IMAGE_URI}" .
            docker push "${IMAGE_URI}"

            mkdir -p /tmp/image
            echo "export IMAGE_URI=${IMAGE_URI}" > /tmp/image/image.env
      - persist_to_workspace:
          root: /tmp/image
          paths:
            - image.env

  deploy:
    executor: node
    environment:
      PROJECT_NAME: dynamo-db-api
      ENVIRONMENT_NAME: dev
      STACK_NAME: dynamo-db-api-dev
      USERS_TABLE_NAME: Users
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/image
      - install_aws_cli
      - run:
          name: Deploy CloudFormation stack
          command: |
            : "${AWS_REGION:?Set AWS_REGION in CircleCI project environment variables}"
            : "${VPC_ID:?Set VPC_ID in CircleCI project environment variables}"
            : "${PUBLIC_SUBNET_IDS:?Set PUBLIC_SUBNET_IDS as a comma-separated list in CircleCI project environment variables}"

            source /tmp/image/image.env

            aws cloudformation deploy \
              --stack-name "${STACK_NAME}" \
              --template-file infrastructure/cloudformation.yml \
              --capabilities CAPABILITY_IAM \
              --parameter-overrides \
                ProjectName="${PROJECT_NAME}" \
                EnvironmentName="${ENVIRONMENT_NAME}" \
                ImageUri="${IMAGE_URI}" \
                VpcId="${VPC_ID}" \
                PublicSubnetIds="${PUBLIC_SUBNET_IDS}" \
                UsersTableName="${USERS_TABLE_NAME}"

            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs" \
              --output table

workflows:
  deploy:
    jobs:
      - install-dependencies:
          filters:
            branches:
              only:
                - main
      - lint:
          requires:
            - install-dependencies
          filters:
            branches:
              only:
                - main
      - test:
          requires:
            - install-dependencies
          filters:
            branches:
              only:
                - main
      - build:
          requires:
            - install-dependencies
          filters:
            branches:
              only:
                - main
      - build-and-push-image:
          requires:
            - lint
            - test
            - build
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build-and-push-image
          filters:
            branches:
              only:
                - main
