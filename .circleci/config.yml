version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project

commands:
  install_aws_cli:
    steps:
      - run:
          name: Install AWS CLI
          command: scripts/install-aws-cli.sh

  install_k8s_tools:
    steps:
      - run:
          name: Install kubectl and eksctl
          command: scripts/install-k8s-tools.sh

  restore_npm_cache:
    steps:
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
            - npm-deps-v1-

  save_npm_cache:
    steps:
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  checkout-code:
    executor: node
    steps:
      - checkout
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  install-dependencies:
    executor: node
    steps:
      - attach_workspace:
          at: ~/project
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - save_npm_cache

  lint:
    executor: node
    steps:
      - attach_workspace:
          at: ~/project
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Lint
          command: npm run lint

  test:
    executor: node
    steps:
      - attach_workspace:
          at: ~/project
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Test
          command: npm run test

  build:
    executor: node
    steps:
      - attach_workspace:
          at: ~/project
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build
          command: npm run build

  build-and-push-image:
    executor: node
    environment:
      ECR_REPOSITORY_NAME: dynamo-db-api
    steps:
      - attach_workspace:
          at: ~/project
      - setup_remote_docker:
          docker_layer_caching: true
      - install_aws_cli
      - run:
          name: Build and push Docker image to ECR
          command: IMAGE_ENV_FILE=image.env scripts/build-and-push-image.sh
      - persist_to_workspace:
          root: ~/project
          paths:
            - image.env

  deploy-eks:
    executor: node
    environment:
      ECR_REPOSITORY_NAME: dynamo-db-api
      USERS_TABLE_NAME: Users
    steps:
      - attach_workspace:
          at: ~/project
      - install_aws_cli
      - install_k8s_tools
      - run:
          name: Deploy ECR image to EKS
          command: |
            source image.env
            SKIP_IMAGE_BUILD=true scripts/deploy-eks.sh

workflows:
  deploy:
    jobs:
      - checkout-code:
          filters:
            branches:
              only:
                - main
      - install-dependencies:
          requires:
            - checkout-code
          filters:
            branches:
              only:
                - main
      - lint:
          requires:
            - install-dependencies
          filters:
            branches:
              only:
                - main
      - test:
          requires:
            - install-dependencies
          filters:
            branches:
              only:
                - main
      - build:
          requires:
            - install-dependencies
          filters:
            branches:
              only:
                - main
      - build-and-push-image:
          requires:
            - lint
            - test
            - build
          filters:
            branches:
              only:
                - main
      - deploy-eks:
          requires:
            - build-and-push-image
          filters:
            branches:
              only:
                - main
