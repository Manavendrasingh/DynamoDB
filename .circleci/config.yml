version: 2.1

executors:
  node:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project

commands:
  install_aws_cli:
    steps:
      - run:
          name: Install AWS CLI
          command: scripts/install-aws-cli.sh

  restore_npm_cache:
    steps:
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
            - npm-deps-v1-

  save_npm_cache:
    steps:
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

jobs:
  install-dependencies:
    executor: node
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - save_npm_cache

  lint:
    executor: node
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Lint
          command: npm run lint

  test:
    executor: node
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Test
          command: npm run test

  build:
    executor: node
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build
          command: npm run build

  build-and-push-image:
    executor: node
    environment:
      ECR_REPOSITORY_NAME: dynamo-db-api
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - install_aws_cli
      - run:
          name: Build and push Docker image
          command: scripts/build-and-push-image.sh
      - persist_to_workspace:
          root: /tmp/image
          paths:
            - image.env

  deploy:
    executor: node
    environment:
      PROJECT_NAME: dynamo-db-api
      ENVIRONMENT_NAME: dev
      STACK_NAME: dynamo-db-api-dev
      USERS_TABLE_NAME: Users
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/image
      - install_aws_cli
      - run:
          name: Deploy CloudFormation stack
          command: scripts/deploy-stack.sh

workflows:
  deploy:
    jobs:
      - install-dependencies:
          filters:
            branches:
              only:
                - main
      - lint:
          requires:
            - install-dependencies
          filters:
            branches:
              only:
                - main
      - test:
          requires:
            - install-dependencies
          filters:
            branches:
              only:
                - main
      - build:
          requires:
            - install-dependencies
          filters:
            branches:
              only:
                - main
      - build-and-push-image:
          requires:
            - lint
            - test
            - build
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build-and-push-image
          filters:
            branches:
              only:
                - main
