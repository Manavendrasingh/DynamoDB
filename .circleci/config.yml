version: 2.1

jobs:
  deploy:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project
    environment:
      PROJECT_NAME: dynamo-db-api
      ENVIRONMENT_NAME: dev
      ECR_REPOSITORY_NAME: dynamo-db-api
      STACK_NAME: dynamo-db-api-dev
      USERS_TABLE_NAME: Users
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Install AWS CLI
          command: |
            sudo apt-get update
            sudo apt-get install -y unzip
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
      - run:
          name: Install dependencies
          command: npm ci
          working_directory: ~/project/dynamo-db
      - run:
          name: Build and test
          command: |
            npm run build
            npm run lint
            npm run test
          working_directory: ~/project/dynamo-db
      - run:
          name: Build and push Docker image
          command: |
            : "${AWS_REGION:?Set AWS_REGION in CircleCI project environment variables}"
            : "${VPC_ID:?Set VPC_ID in CircleCI project environment variables}"
            : "${PUBLIC_SUBNET_IDS:?Set PUBLIC_SUBNET_IDS as a comma-separated list in CircleCI project environment variables}"

            AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
            ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE_TAG="${CIRCLE_SHA1}"
            IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY_NAME}:${IMAGE_TAG}"

            aws ecr describe-repositories --repository-names "${ECR_REPOSITORY_NAME}" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "${ECR_REPOSITORY_NAME}" >/dev/null

            aws ecr get-login-password --region "${AWS_REGION}" | \
              docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            docker build -t "${IMAGE_URI}" .
            docker push "${IMAGE_URI}"

            echo "export IMAGE_URI=${IMAGE_URI}" >> "${BASH_ENV}"
          working_directory: ~/project/dynamo-db
      - run:
          name: Deploy CloudFormation stack
          command: |
            aws cloudformation deploy \
              --stack-name "${STACK_NAME}" \
              --template-file infrastructure/cloudformation.yml \
              --capabilities CAPABILITY_IAM \
              --parameter-overrides \
                ProjectName="${PROJECT_NAME}" \
                EnvironmentName="${ENVIRONMENT_NAME}" \
                ImageUri="${IMAGE_URI}" \
                VpcId="${VPC_ID}" \
                PublicSubnetIds="${PUBLIC_SUBNET_IDS}" \
                UsersTableName="${USERS_TABLE_NAME}"

            aws cloudformation describe-stacks \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs" \
              --output table
          working_directory: ~/project/dynamo-db

workflows:
  deploy:
    jobs:
      - deploy:
          filters:
            branches:
              only:
                - main
