apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamo-db-api
  namespace: dynamo-db-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dynamo-db-api
  template:
    metadata:
      labels:
        app: dynamo-db-api
    spec:
      serviceAccountName: dynamo-db-api
      containers:
        - name: dynamo-db-api
          image: <IMAGE_URI>
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: dynamo-db-api-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
